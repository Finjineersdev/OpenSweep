[workspace]
resolver = "2"
members = ["crates/opensweep-core", "crates/opensweep-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/Finjineersdev/OpenSweep"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
proptest = "1"
tempfile = "3"
# Safe openat/renameat for the move (I12, I15); the engine forbids `unsafe`.
rustix = { version = "1", features = ["fs"] }
