schema = 2
id = "python"
name = "Python"

[detect]
any_files = ["pyproject.toml", "requirements.txt", "setup.py"]

[[artifact]]
path = ".venv"
class = "caution"
reason = "Virtual environment. Recreate it and reinstall dependencies."
restore = "python -m venv .venv, then install dependencies"
requires = { inside = ["pyvenv.cfg"] }

[[artifact]]
path = ".pytest_cache"
class = "safe"
reason = "pytest cache. Recreated on the next test run."
restore = "Recreated automatically"

[[artifact]]
path = ".ruff_cache"
class = "safe"
reason = "Ruff lint cache. Recreated on the next lint run."
restore = "Recreated automatically"

[[artifact]]
path = "venv"
class = "caution"
reason = "Virtual environment. Recreate it and reinstall dependencies."
restore = "python -m venv venv, then install dependencies"
requires = { inside = ["pyvenv.cfg"] }

[[artifact]]
path = "__pycache__"
class = "safe"
reason = "Compiled bytecode. Python rewrites it on the next import."
restore = "Recreated automatically"

[[artifact]]
path = ".mypy_cache"
class = "safe"
reason = "mypy type-check cache. Recreated on the next check."
restore = "Recreated automatically"

[[artifact]]
path = ".tox"
class = "safe"
reason = "tox test environments. Recreated on the next tox run."
restore = "tox"

# https://nox.thea.codes/en/stable/usage.html: "By default Nox stores
# virtualenvs in ./.nox".
[[artifact]]
path = ".nox"
class = "safe"
reason = "nox session environments. Recreated on the next nox run."
restore = "nox"
